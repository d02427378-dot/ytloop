name: MultiScreen Bot
on:
  schedule:
    - cron: "0 */6 * * *"   # relance toutes les 6 h (UTC)
  workflow_dispatch:         # lancement manuel

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python bot.py --minutes 340 --interval 360
        env:
          VIDEO_URL: "https://youtu.be/NrVpHJvtCGc?si=iXPaGaZVcvQn_-qM"